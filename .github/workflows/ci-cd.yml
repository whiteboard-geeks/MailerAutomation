name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          flake8 .

      - name: Run type checking
        run: |
          mypy

  blueprint-unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        blueprint: [easypost, gmail, instantly, utils] # Added gmail blueprint to the test matrix
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests for ${{ matrix.blueprint }}
        run: |
          pytest tests/unit/${{ matrix.blueprint }} -v
        env:
          GMAIL_SERVICE_ACCOUNT_INFO: ${{ secrets.GMAIL_SERVICE_ACCOUNT_INFO }}
          CLOSE_API_KEY: "dummy"
          INSTANTLY_API_KEY: "dummy"
          EASYPOST_TEST_API_KEY: "dummy"
          EASYPOST_PROD_API_KEY: "dummy"
          TEST_EMAIL_SENDER: "dummy@example.com"
          TEST_EMAIL_RECIPIENT: "dummy@example.com"
          TEMPORAL_WORKFLOW_UI_BASE_URL: "dummy"
          ERROR_EMAIL_RECIPIENTS_CSV: ""

  # Deploys go to the Whiteboard Geeks Hetzner box (wbg-apps) over ssh. The
  # deploy key can only run /usr/local/sbin/mailer-automation-deploy there,
  # which builds the commit, restarts web + worker, checks health and rolls
  # back on failure. Integration tests run on the box against staging, because
  # they need staging's local Redis.
  deploy-to-staging:
    needs: blueprint-unit-tests
    runs-on: ubuntu-latest
    concurrency: wbg-apps-deploy
    steps:
      - name: Deploy to staging on wbg-apps
        env:
          DEPLOY_KEY: ${{ secrets.WBG_APPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.WBG_APPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ma-deploy@app.whiteboardgeeks.com "staging ${{ github.sha }}"

  blueprint-integration-tests:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    concurrency: wbg-apps-deploy
    timeout-minutes: 45
    steps:
      - name: Run integration tests on staging (instantly, easypost, gmail)
        env:
          DEPLOY_KEY: ${{ secrets.WBG_APPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.WBG_APPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30 ma-deploy@app.whiteboardgeeks.com "staging ${{ github.sha }} test"

  deploy-to-production:
    needs: blueprint-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: wbg-apps-deploy
    steps:
      - name: Deploy to production on wbg-apps
        env:
          DEPLOY_KEY: ${{ secrets.WBG_APPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.WBG_APPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ma-deploy@app.whiteboardgeeks.com "production ${{ github.sha }}"

  verify-webhooks:
    needs: deploy-to-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests  # For API calls

      - name: Verify and create webhooks
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          EASYPOST_PROD_API_KEY: ${{ secrets.EASYPOST_PROD_API_KEY }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          python scripts/verify_production_webhooks.py
