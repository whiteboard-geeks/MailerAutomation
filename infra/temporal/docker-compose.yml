x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgresql:
    image: postgres:16-alpine
    container_name: temporal-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
    volumes:
      - temporal_postgresql_data:/var/lib/postgresql/data
    networks:
      - temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *default-logging

  schema:
    image: temporalio/admin-tools:${TEMPORAL_VERSION}
    container_name: temporal-schema
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgresql
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    networks:
      - temporal
    restart: "no"
    logging: *default-logging

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION}
    container_name: temporal-server
    restart: unless-stopped
    depends_on:
      schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
      NUM_HISTORY_SHARDS: "4"
      SQL_MAX_CONNS: "10"
      SQL_MAX_IDLE_CONNS: "10"
      SQL_VIS_MAX_CONNS: "5"
      SQL_VIS_MAX_IDLE_CONNS: "5"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - temporal
    expose:
      - "7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 30
    logging: *default-logging

  namespace-setup:
    image: temporalio/admin-tools:${TEMPORAL_VERSION}
    container_name: temporal-namespace-setup
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      PROD_NAMESPACE: ${PROD_NAMESPACE}
      STAGING_NAMESPACE: ${STAGING_NAMESPACE}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-namespaces.sh
    networks:
      - temporal
    restart: "no"
    logging: *default-logging

  ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    container_name: temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      namespace-setup:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: ${PROD_NAMESPACE}
      TEMPORAL_UI_PUBLIC_PATH: /temporal
      TEMPORAL_CORS_ORIGINS: https://app.whiteboardgeeks.com
      TEMPORAL_DISABLE_NEWS_FETCH: "true"
    networks:
      - temporal
    ports:
      - "127.0.0.1:8088:8080"
    logging: *default-logging

  mtls-proxy:
    image: haproxy:3.2-alpine
    container_name: temporal-mtls-proxy
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./pki/proxy:/usr/local/etc/haproxy/certs:ro
    networks:
      - temporal
    ports:
      - "7233:7233"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

volumes:
  temporal_postgresql_data:
    name: temporal_postgresql_data

networks:
  temporal:
    name: temporal
    driver: bridge
